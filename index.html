<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GT 06 Contabilidade | Pesquisas em Andamento</title>
  <style>
    :root {
      --navy: #1B2C4E;
      --navy-deep: #0F1E38;
      --amber: #E8960A;
      --amber-dark: #C67D06;
      --white: #FFFFFF;
      --gray-700: #4D5564;
      --shadow: 0 12px 28px rgba(15, 30, 56, 0.22);
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--navy-deep);
      background:
        radial-gradient(circle at 15% 20%, rgba(232, 150, 10, 0.18), transparent 42%),
        radial-gradient(circle at 90% 10%, rgba(27, 44, 78, 0.18), transparent 40%),
        linear-gradient(140deg, #f7f9fc 0%, #eef2f8 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .notice {
      width: min(780px, 100%);
      background: var(--white);
      border: 1px solid rgba(27, 44, 78, 0.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(24px, 4vw, 40px);
      text-align: center;
    }

    .kicker {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--amber-dark);
      margin-bottom: 14px;
    }

    h1 {
      color: var(--navy);
      font-size: clamp(24px, 3.6vw, 36px);
      line-height: 1.2;
      margin-bottom: 14px;
    }

    p {
      color: var(--gray-700);
      font-size: clamp(15px, 2.1vw, 18px);
      line-height: 1.65;
      margin-bottom: 28px;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--amber);
      color: var(--white);
      text-decoration: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 700;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      background: var(--amber-dark);
      transform: translateY(-1px);
      outline: none;
    }

    .footnote {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7380;
    }
  </style>
</head>
<body>
  <main class="notice">
    <span class="kicker">Comunicado</span>
    <h1>As pesquisas foram migradas para outro ambiente</h1>
    <p>
      As pesquisas do GT 06 Contabilidade estão sendo realizadas no link abaixo.
      Este ambiente não disponibiliza mais os formulários anteriores.
    </p>
    <a class="cta" href="https://gefin.net.br/pesquisas-em-andamento/" target="_blank" rel="noopener noreferrer">
      Acessar pesquisas em andamento
    </a>
    <p class="footnote">Link oficial: https://gefin.net.br/pesquisas-em-andamento/</p>
  </main>
</body>
</html>
